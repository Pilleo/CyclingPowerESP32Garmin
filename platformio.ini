; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native, test_resistance

[env:esp32doit-devkit-v1]
platform = espressif32
#lolin32_lite
#esp32doit-devkit-v1
board = lolin32_lite
framework = arduino
upload_protocol = esptool
#upload_port = esp32-F8ACC8
; upload_flags =
;     --host_port=12345
monitor_speed = 115200
lib_deps = 
    h2zero/NimBLE-Arduino@^2.3.6

[env:native]
platform = native
build_flags = -DNATIVE_TEST -Isrc
build_src_filter = +<test/test_cadence_logic/> +<src/Cadence.cpp>
test_filter = test_cadence_logic
lib_deps =
    Unity

[env:test_resistance]
platform = native
build_flags = -DNATIVE_TEST
build_src_filter = +<test/test_resistance/>
test_filter = test_resistance
lib_deps =
    Unity

